services:
  postgres:
    image: postgres:16-alpine
    container_name: apupu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apupu_user
      POSTGRES_PASSWORD: apupu_password
      POSTGRES_DB: apupu
    # Publicação em dual-stack (IPv4 e IPv6): clientes que resolvem
    # "localhost" para ::1 não encontram nada se só houver IPv4.
    ports:
      - '127.0.0.1:5433:5432'
      - '[::1]:5433:5432'
    volumes:
      - apupu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apupu_user -d apupu']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apupu_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # development mantém /api-docs ativo dentro do container.
      NODE_ENV: development
      PORT: '3000'
      CORS_ALLOW_LOCALHOST: ${CORS_ALLOW_LOCALHOST:-true}
      DATABASE_URL: postgres://apupu_user:apupu_password@postgres:5432/apupu
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      # Em produção, exportar TOKEN_PEPPER no ambiente do host:
      #   export TOKEN_PEPPER=$(openssl rand -base64 48)
      TOKEN_PEPPER: ${TOKEN_PEPPER:-apupu_dev_only_token_pepper_mude_em_producao_2026}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-json}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Conto Contigo <convites@apupu.local>}
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Conto Contigo}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      EMAIL_JSON_DIR: ${EMAIL_JSON_DIR:-tmp/outbox}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      OUTBOX_SCAN_INTERVAL_MS: ${OUTBOX_SCAN_INTERVAL_MS:-60000}
      MAX_INVITATIONS_PER_EVENT: ${MAX_INVITATIONS_PER_EVENT:-1000}
    ports:
      - '127.0.0.1:3000:3000'
      - '[::1]:3000:3000'
    # Aplica migrations pendentes antes de arrancar o servidor.
    command: ['sh', '-c', 'npm run migrate:up && node dist/server.js']
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider -q http://127.0.0.1:3000/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  apupu_postgres_data:
